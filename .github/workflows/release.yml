name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and test
        run: |
          python scripts/pipeline.py --check
          python -m unittest discover -s tests
      - name: Build offline site
        run: |
          python scripts/pipeline.py --out "$NAME-$TAG"
          cp README.md LICENSE "$NAME-$TAG/"
          mkdir release
          zip -rq "release/$NAME-$TAG-offline-site.zip" "$NAME-$TAG"
      - name: Publish GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$NAME $TAG" --generate-notes --verify-tag
          fi
